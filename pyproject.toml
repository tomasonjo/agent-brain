[project]
name = "agent-brain"
version = "0.1.0"
description = "Single-user agentic brain — Neo4j memory + cron-driven flows + MCP/hooks across Claude Code, Codex, Cursor."
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "mcp[cli]>=1.2",
    "apscheduler>=3.10",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "croniter>=2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
brain = "brain.cli.brain:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
